{% extends "base.html" %}

{% block content %}
<div class="container" style="padding-top: 5rem; padding-bottom: 7rem; max-width: 480px;">
    <div style="border: 1px solid var(--border); background-color: var(--white); padding: 2.75rem 2.25rem;">
        <div style="border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem;">
            <span class="meta-label">ACCOUNT SIGN IN</span>
            <h1 class="display-lg" style="font-size: 1.85rem; margin-top: 0.5rem;">SIGN IN</h1>
            <p style="font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem;">
                Sign in to view your purchased licenses, download links, and order history.
            </p>
        </div>

        {% if error %}
        <div style="padding: 0.85rem 1rem; border: 1px solid #c33; background: #fff5f5; color: #c33; font-size: 0.82rem; margin-bottom: 1.5rem;" class="meta-mono">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login_page') }}" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
            {% endif %}

            <div>
                <label for="identifier" class="meta-label" style="display: block; margin-bottom: 0.35rem;">USERNAME OR EMAIL</label>
                <input type="text" id="identifier" name="identifier" required autocomplete="username"
                       placeholder="username or email@example.com"
                       style="width: 100%; padding: 0.75rem 0.9rem; border: 1px solid var(--border); font-family: var(--font-mono); font-size: 0.85rem; background: var(--bg);">
            </div>

            <div>
                <label for="password" class="meta-label" style="display: block; margin-bottom: 0.35rem;">PASSWORD</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       placeholder="••••••••••••"
                       style="width: 100%; padding: 0.75rem 0.9rem; border: 1px solid var(--border); font-family: var(--font-mono); font-size: 0.85rem; background: var(--bg);">
            </div>

            <button type="submit" class="btn btn-dark" style="width: 100%; padding: 1rem; margin-top: 0.5rem; font-size: 0.8rem;">
                SIGN IN →
            </button>
        </form>

        <div style="border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 2rem; text-align: center;">
            <p style="font-size: 0.82rem; color: var(--muted); margin-bottom: 0.75rem;">
                Don't have an account yet?
            </p>
            <a href="{{ url_for('register_page') }}" class="link-underline" style="font-size: 0.75rem; text-transform: uppercase;">
                CREATE ACCOUNT →
            </a>
        </div>
    </div>
</div>
{% endblock %}
