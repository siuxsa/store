<div id="modal-password-reset" class="admin-modal">
        <div class="admin-modal-box" style="max-width:440px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; padding-bottom:0.75rem; border-bottom:1px solid var(--admin-border);">
                <h3 style="font-size:15px; font-weight:700; text-transform:uppercase; color:#00e5ff;">RESET USER PASSWORD</h3>
                <button type="button" onclick="closeModal('modal-password-reset')" class="btn-admin btn-admin-outline" style="padding:0.25rem 0.6rem; display:inline-flex; align-items:center;">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form onsubmit="submitPasswordReset(event)" style="display:flex; flex-direction:column; gap:1rem;">
                <input type="hidden" id="pwd-reset-user-id">
                <div class="form-group">
                    <label class="form-label">USERNAME</label>
                    <input type="text" id="pwd-reset-username" class="form-input" disabled style="opacity:0.75; font-weight:700;">
                </div>
                <div class="form-group">
                    <label class="form-label">NEW PASSWORD (MIN 6 CHARACTERS)</label>
                    <input type="password" id="pwd-reset-input" class="form-input" required placeholder="Enter new password...">
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:0.5rem;">
                    <button type="button" onclick="closeModal('modal-password-reset')" class="btn-admin btn-admin-outline">CANCEL</button>
                    <button type="submit" class="btn-admin btn-admin-primary">UPDATE PASSWORD</button>
                </div>
            </form>
        </div>
    </div>
