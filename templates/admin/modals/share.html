<!-- MINIMAL STOREFRONT SHARE ADVISORY POPUP MODAL (BRAND MATCHED) -->
<div id="modal-share-advisory" class="share-modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="share-modal-heading">
    <div class="share-modal-card">
        <div class="share-modal-top">
            <h3 id="share-modal-heading" class="share-modal-title">SHARE ARTICLE</h3>
            <button type="button" id="share-modal-close-x" class="share-modal-close" onclick="closeShareModal()" aria-label="Close Share Modal">✕</button>
        </div>

        <div class="share-icons-row">
            <!-- 1. FACEBOOK -->
            <button type="button" id="share-btn-fb" class="share-icon-btn" title="Share on Facebook">
                <div class="share-icon-circle fb">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </div>
                <span class="share-icon-name">Facebook</span>
            </button>

            <!-- 2. X (TWITTER) -->
            <button type="button" id="share-btn-x" class="share-icon-btn" title="Share on X">
                <div class="share-icon-circle x">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#111111">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </div>
                <span class="share-icon-name">X</span>
            </button>

            <!-- 3. GMAIL -->
            <button type="button" id="share-btn-gmail" class="share-icon-btn" title="Share via Gmail">
                <div class="share-icon-circle gmail">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 13.065l8.76-6.132A3.978 3.978 0 0 0 18 5.5H6c-1.026 0-1.96.388-2.668 1.028L12 13.065z"/>
                        <path fill="#4285F4" d="M21.94 8.74L12 15.698 2.06 8.74C2.02 9.006 2 9.278 2 9.556V18.5A3.5 3.5 0 0 0 5.5 22h13a3.5 3.5 0 0 0 3.5-3.5V9.556c0-.278-.02-.55-.06-.816z"/>
                    </svg>
                </div>
                <span class="share-icon-name">Gmail</span>
            </button>

            <!-- 4. COPY -->
            <button type="button" id="share-btn-copy" class="share-icon-btn" onclick="copyShareUrl()" title="Copy Link">
                <div class="share-icon-circle copy">
                    <svg id="share-copy-svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                </div>
                <span id="share-copy-label" class="share-icon-name">Copy</span>
            </button>
        </div>
    </div>
</div>
